<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Images Preview | HUMYNEX STUDIO</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1c050a;
      color: #faf5f6;
      padding: 4rem 2rem;
      margin: 0;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      text-align: center;
      color: #d89ba6;
      font-size: 3rem;
      margin-bottom: 4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #2d0a14;
      border: 1px solid rgba(216, 155, 166, 0.2);
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border: 1px solid #d89ba6;
      cursor: pointer;
    }
    .info {
      margin-top: 15px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #ebdce0;
    }
  </style>
</head>
<body>
  <h1>HUMYNEX STUDIO - Extracted Portfolio Images (Pages 9 - 21)</h1>
  <div class="grid" id="grid"></div>
  <script>
    const images = [
      "page_9_img_0.jpeg", "page_10_img_0.jpeg", "page_11_img_0.jpeg", "page_12_img_0.jpeg",
      "page_13_img_0.jpeg", "page_14_img_0.jpeg", "page_14_img_1.jpeg", "page_15_img_0.jpeg",
      "page_16_img_0.jpeg", "page_17_img_0.jpeg", "page_18_img_0.jpeg", "page_18_img_1.jpeg",
      "page_19_img_0.jpeg", "page_19_img_1.jpeg", "page_20_img_0.jpeg", "page_21_img_0.jpeg"
    ];
    const grid = document.getElementById('grid');
    images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="images/extracted/${img}" alt="${img}" onclick="window.open(this.src, '_blank')">
        <div class="info">${img}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
